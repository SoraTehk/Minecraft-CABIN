# ServerPackCreator 9.4.1 config for CABIN's server runner (see README.md next to it). In TOML, every key after a [[table]] header belongs to
# that table, so the plain settings come first.
modpackDir = "C:/Projects/.minecraft/Minecraft-PrismLauncher-Manual/instances/CABIN- Create Above & Beyond In Newer/minecraft"
minecraftVersion = "1.20.1"
modLoader = "Forge"
modLoaderVersion = "47.4.10"
# Empty: ServerPackCreator's own, maintained list of clientside-only mods decides what stays off the server
clientMods = []
whitelist = []
serverIconPath = "C:/Projects/.minecraft/Minecraft-PrismLauncher-Manual/instances/CABIN- Create Above & Beyond In Newer/minecraft/_server/server-icon.png"
serverPropertiesPath = "C:/Projects/.minecraft/Minecraft-PrismLauncher-Manual/instances/CABIN- Create Above & Beyond In Newer/minecraft/_server/server.properties"
includeServerIcon = true
includeServerProperties = true
includeZipCreation = false
javaArgs = "-Xmx4G -Xms4G"
serverPackSuffix = ""

[[inclusions]]
	source = "config"
	destination = ""
	inclusionFilter = ""
	exclusionFilter = ""
[[inclusions]]
	source = "defaultconfigs"
	destination = ""
	inclusionFilter = ""
	exclusionFilter = ""
[[inclusions]]
	source = "kubejs"
	destination = ""
	inclusionFilter = ""
	exclusionFilter = ""
[[inclusions]]
	source = "ldlib"
	destination = ""
	inclusionFilter = ""
	exclusionFilter = ""
[[inclusions]]
	source = "mods"
	destination = ""
	inclusionFilter = ""
	exclusionFilter = ""

[scripts]
	# The launcher's bundled Java, relative to _server (minecraft\_server -> instance -> instances -> launcher)
	SPC_JAVA_SPC = '..\..\..\..\java\java-runtime-gamma\bin\java'
	SPC_SKIP_JAVA_CHECK_SPC = "true"
	# Install Forge with its own installer into libraries\ once, instead of the ServerStarterJar reinstalling it
	# from the internet at every start
	SPC_USE_SSJ_SPC = "false"
	# ServerPackCreator's default list without "libraries" (a junction to the launcher's shared folder) and "ldlib"
	# (CABIN's Multiblocked2 machines, which the server needs)
	SPC_CLEANUP_SPC = "run.sh,run.bat,*installer.jar,*installer.jar.log,server.jar,.mixin.out,local,fabric-server-launcher.jar,fabric-server-launch.jar,.fabric-installer,fabric-installer.jar,legacyfabric-installer.jar,.fabric versions"
